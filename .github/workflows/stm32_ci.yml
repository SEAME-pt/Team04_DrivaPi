name: STM32 CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build-firmware:
    name: Build full STM32 firmware (compile only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Show toolchain version
        run: arm-none-eabi-gcc --version

      - name: Generate Secrets Header
        run: |
          cat <<EOF > firmware/Core/Inc/app_secrets.h
          #ifndef APP_SECRETS_H
          #define APP_SECRETS_H

          #define WIFI_SSID           "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASSWORD       "${{ secrets.WIFI_PASSWORD }}"
          #define WIFI_STATIC_IP      ${{ secrets.WIFI_STATIC_IP }}
          #define WIFI_NETMASK        ${{ secrets.WIFI_NETMASK }}
          #define WIFI_GATEWAY        ${{ secrets.WIFI_GATEWAY }}
          #define WIFI_DNS_SERVER     ${{ secrets.WIFI_DNS_SERVER }}

          #define MQTT_BROKER_IP_0    ${{ secrets.MQTT_BROKER_IP_0 }}
          #define MQTT_BROKER_IP_1    ${{ secrets.MQTT_BROKER_IP_1 }}
          #define MQTT_BROKER_IP_2    ${{ secrets.MQTT_BROKER_IP_2 }}
          #define MQTT_BROKER_IP_3    ${{ secrets.MQTT_BROKER_IP_3 }}
          #define MQTT_USERNAME       "${{ secrets.MQTT_USERNAME }}"
          #define MQTT_PASSWORD       "${{ secrets.MQTT_PASSWORD }}"

          #endif
          EOF
          
          # Injeta o ficheiro de segredos no main.h para o tornar global na CI
          echo '#include "app_secrets.h"' >> firmware/Core/Inc/main.h

      - name: Build project (full STM32 firmware)
        working-directory: firmware/Debug
        run: |
          set -e
          make -f makefile main-build -j"$(nproc)"
          if [ ! -f firmware.elf ]; then
            echo "Error: firmware.elf not found, build failed!"
            exit 1
          fi
          echo "Full firmware built: firmware.elf"
          arm-none-eabi-readelf -h firmware.elf || true
          hexdump -C firmware.elf | sed -n '1,4p' || true

      - name: Upload firmware.elf as artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-elf
          path: firmware/Debug/firmware.elf
          retention-days: 30