name: "CodeQL C Analysis for STM32"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-analyze:
    name: CodeQL Analysis (build + analyze)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            make

      - name: Show ARM toolchain version
        run: arm-none-eabi-gcc --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: cpp
          queries: security-and-quality
          build-mode: manual
          config-file: ./.github/codeql-config.yml

      - name: Generate Secrets Header
        run: |
          mkdir -p firmware/Core/Inc/MX_WIFI
          
          W_SSID="${{ secrets.WIFI_SSID }}"
          W_PASS="${{ secrets.WIFI_PASSWORD }}"
          W_IP="${{ secrets.WIFI_STATIC_IP }}"
          W_MASK="${{ secrets.WIFI_NETMASK }}"
          W_GATE="${{ secrets.WIFI_GATEWAY }}"
          W_DNS="${{ secrets.WIFI_DNS_SERVER }}"
          
          M_IP0="${{ secrets.MQTT_BROKER_IP_0 }}"
          M_IP1="${{ secrets.MQTT_BROKER_IP_1 }}"
          M_IP2="${{ secrets.MQTT_BROKER_IP_2 }}"
          M_IP3="${{ secrets.MQTT_BROKER_IP_3 }}"
          M_USER="${{ secrets.MQTT_USERNAME }}"
          M_PASS="${{ secrets.MQTT_PASSWORD }}"

          [ -z "$W_SSID" ] && W_SSID="dummy_ssid"
          [ -z "$W_PASS" ] && W_PASS="dummy_password"
          
          [ -z "$W_IP" ]   && W_IP="{0}"
          [ -z "$W_MASK" ] && W_MASK="{0}"
          [ -z "$W_GATE" ] && W_GATE="{0}"
          [ -z "$W_DNS" ]  && W_DNS="{0}"
          
          [ -z "$M_IP0" ]  && M_IP0="0"
          [ -z "$M_IP1" ]  && M_IP1="0"
          [ -z "$M_IP2" ]  && M_IP2="0"
          [ -z "$M_IP3" ]  && M_IP3="0"
          [ -z "$M_USER" ] && M_USER="dummy_user"
          [ -z "$M_PASS" ] && M_PASS="dummy_password"

          cat <<EOF > firmware/Core/Inc/MX_WIFI/wifi_credentials.h
          #ifndef WIFI_CREDENTIALS_H
          #define WIFI_CREDENTIALS_H

          #define WIFI_SSID           "$W_SSID"
          #define WIFI_PASSWORD       "$W_PASS"
          #define WIFI_STATIC_IP      $W_IP
          #define WIFI_NETMASK        $W_MASK
          #define WIFI_GATEWAY        $W_GATE
          #define WIFI_DNS_SERVER     $W_DNS

          #define MQTT_BROKER_IP_0    $M_IP0
          #define MQTT_BROKER_IP_1    $M_IP1
          #define MQTT_BROKER_IP_2    $M_IP2
          #define MQTT_BROKER_IP_3    $M_IP3
          #define MQTT_USERNAME       "$M_USER"
          #define MQTT_PASSWORD       "$M_PASS"

          #endif
          EOF

          grep -q 'MX_WIFI/wifi_credentials.h' firmware/Core/Inc/main.h || echo '#include "MX_WIFI/wifi_credentials.h"' >> firmware/Core/Inc/main.h

      - name: Build project for CodeQL
        run: |
          set -e
          cd firmware/Debug
          echo "🧹 Cleaning previous build artifacts..."
          make -f makefile clean
          echo "🔨 Building firmware for CodeQL..."
          make -f makefile main-build
          test -f firmware.elf
          echo "✅ Build successful"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: '/language:cpp'
          output: results
          upload: false
          wait-for-processing: true

      - name: Filter SARIF results
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -**/Drivers/**
            -**/Middlewares/**
            -**/AZURE_RTOS/**
            -**/Core/Startup/**
            -**/Debug/**
            -**/Release/**
            -**/Core/Src/system_stm32u5xx.c/**
          input: results/cpp.sarif
          output: results/cpp.sarif

      - name: Validate static analysis (SARIF gate)
        run: |
          python3 scripts/ci/validate_static_analysis.py \
            --sarif-candidates results/cpp.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-filtered
          path: results/cpp.sarif
          retention-days: 30

  upload-sarif:
    name: Upload SARIF to GitHub Security
    needs: codeql-analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Download CodeQL SARIF artifact
        uses: actions/download-artifact@v8
        with:
          name: codeql-sarif-filtered
          path: sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: sarif/cpp.sarif
