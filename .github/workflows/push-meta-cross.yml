name: Sync meta-cross to separate repo

on:
  push:
    branches:
      - fix/sync-meta-cross

permissions:
  contents: write
  id-token: write
  
env:
  GITHUB_TOKEN: ""

concurrency:
  group: meta-cross-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "meta-layer bot"
          git config --global user.email "bot@drivapi.com"

      - name: Split meta-cross folder
        run: |
          git subtree split --prefix=meta-cross --branch meta-cross-only || exit 1

      - name: Debug Secret
        run: '[ -z "${{ secrets.META_DRIVAPI_SSH_KEY }}" ] && echo "SSH Key is missing!" && exit 1 || echo "SSH Key is set"'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.META_DRIVAPI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push to meta-cross repo
        run: |
          git push git@github.com:Zahhask45/meta-drivapi.git meta-cross-only:main --force -v || exit 1
