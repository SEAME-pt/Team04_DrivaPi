name: "Unit Tests & TSF Artifacts"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: Run Tests & Generate TSF Evidence
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build/host
      COVERAGE_DIR: build/coverage
      # Tells GCC where to find dummy header files like MQTTClient.h
      CPATH: ${{ github.workspace }}/tests/unit/shims

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            lcov \
            ruby \
            ruby-dev \
            python3-pip

      - name: Install Ceedling and gcovr
        run: |
          sudo gem install ceedling
          pip3 install gcovr

      - name: Verify tool versions
        run: |
          echo "=== Tool Versions ==="
          gcc --version
          cmake --version
          ceedling version
          lcov --version
          gcovr --version

      # --- UPDATED STEP: GENERATE CREDENTIALS & TYPE SHIMS ---
      - name: Generate Mock/Secrets Header & Type Shims
        run: |
          mkdir -p firmware/Core/Inc/MX_WIFI
          
          W_SSID="${{ secrets.WIFI_SSID }}"
          W_PASS="${{ secrets.WIFI_PASSWORD }}"
          W_IP="${{ secrets.WIFI_STATIC_IP }}"
          W_MASK="${{ secrets.WIFI_NETMASK }}"
          W_GATE="${{ secrets.WIFI_GATEWAY }}"
          W_DNS="${{ secrets.WIFI_DNS_SERVER }}"
          
          M_IP0="${{ secrets.MQTT_BROKER_IP_0 }}"
          M_IP1="${{ secrets.MQTT_BROKER_IP_1 }}"
          M_IP2="${{ secrets.MQTT_BROKER_IP_2 }}"
          M_IP3="${{ secrets.MQTT_BROKER_IP_3 }}"
          M_USER="${{ secrets.MQTT_USERNAME }}"
          M_PASS="${{ secrets.MQTT_PASSWORD }}"

          [ -z "$W_SSID" ] && W_SSID="dummy_ssid"
          [ -z "$W_PASS" ] && W_PASS="dummy_password"
          [ -z "$M_USER" ] && M_USER="dummy_user"
          [ -z "$M_PASS" ] && M_PASS="dummy_password"
          
          [ -z "$M_IP0" ]  && M_IP0="0"
          [ -z "$M_IP1" ]  && M_IP1="0"
          [ -z "$M_IP2" ]  && M_IP2="0"
          [ -z "$M_IP3" ]  && M_IP3="0"

          format_ip() {
            local ip="$1"
            if [ -z "$ip" ]; then
              echo "{0}"
            elif [[ "$ip" == *.* ]]; then
              echo "{${ip//./,}}"
            else
              echo "$ip"
            fi
          }

          W_IP=$(format_ip "$W_IP")
          W_MASK=$(format_ip "$W_MASK")
          W_GATE=$(format_ip "$W_GATE")
          W_DNS=$(format_ip "$W_DNS")

          cat <<EOF > firmware/Core/Inc/MX_WIFI/wifi_credentials.h
          #ifndef WIFI_CREDENTIALS_H
          #define WIFI_CREDENTIALS_H

          #define WIFI_SSID           "$W_SSID"
          #define WIFI_PASSWORD       "$W_PASS"
          #define WIFI_STATIC_IP      $W_IP
          #define WIFI_NETMASK        $W_MASK
          #define WIFI_GATEWAY        $W_GATE
          #define WIFI_DNS_SERVER     $W_DNS

          #define MQTT_BROKER_IP_0    $M_IP0
          #define MQTT_BROKER_IP_1    $M_IP1
          #define MQTT_BROKER_IP_2    $M_IP2
          #define MQTT_BROKER_IP_3    $M_IP3
          #define MQTT_USERNAME       "$M_USER"
          #define MQTT_PASSWORD       "$M_PASS"

          /* Host Shims for Unit Testing */
          #ifdef TEST
          #ifndef HOST_SHIMS_H
          #define HOST_SHIMS_H

          // 1. STM32 HAL Hardware Handles
          typedef int SPI_HandleTypeDef;
          typedef int UART_HandleTypeDef;
          typedef int USART_HandleTypeDef;
          typedef int TIM_HandleTypeDef;
          typedef int I2C_HandleTypeDef;
          typedef int DMA_HandleTypeDef;

          // 2. Azure RTOS ThreadX Handles
          typedef int TX_SEMAPHORE;
          typedef int TX_MUTEX;
          typedef int TX_QUEUE;
          typedef int TX_THREAD;
          typedef int TX_EVENT_FLAGS_GROUP;

          // 3. MQTT Structs
          typedef struct MessageData {
              int topic;
              int message;
          } MessageData;

          #endif /* HOST_SHIMS_H */
          #endif /* TEST */

          #endif /* WIFI_CREDENTIALS_H */
          EOF
          
          grep -q 'MX_WIFI/wifi_credentials.h' firmware/Core/Inc/main.h || echo '#include "MX_WIFI/wifi_credentials.h"' >> firmware/Core/Inc/main.h

      - name: Create Host Shims for Unit Tests
        run: |
          mkdir -p tests/unit/shims
          
          # Shadow stm32u5xx_hal.h to satisfy mock generation
          cat <<EOF > tests/unit/shims/stm32u5xx_hal.h
          #ifndef STM32U5XX_HAL_H
          #define STM32U5XX_HAL_H
          #endif
          EOF

          # Shadow tx_api.h to satisfy mock generation
          cat <<EOF > tests/unit/shims/tx_api.h
          #ifndef TX_API_H
          #define TX_API_H
          #endif
          EOF

          # Dummy MQTTClient.h to prevent missing file error
          cat <<EOF > tests/unit/shims/MQTTClient.h
          #ifndef MQTTCLIENT_H
          #define MQTTCLIENT_H
          
          typedef int MQTTClient;
          typedef int Network;
          
          #endif
          EOF

      - name: Run Tests (Master Script)
        run: |
          chmod +x tests/unit/run_all_tests.sh
          bash tests/unit/run_all_tests.sh 2>&1 | tee test_output.log

      - name: Validate LLTC coverage (baseline gate)
        run: |
          python3 scripts/ci/validate_lltc_coverage.py \
            --base-dir artifacts/verification/coverage \
            --suites dc-motor servo-motor speed-sensor \
            --baseline tests/verification/coverage/baseline.json \
            --min-line-rate 90.0

      - name: Upload Verification Artifacts (TSF)
        uses: actions/always()
        if: always()
        with:
          name: verification-artifacts
          path: artifacts/verification
          retention-days: 30

      - name: Upload Coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: build/coverage/html
          retention-days: 30

      - name: Generate unit test summary (markdown)
        if: always()
        run: |
          chmod +x scripts/ci/summarize_test_results.sh
          if ! scripts/ci/summarize_test_results.sh test_output.log "LLTC Coverage Validation Summary.txt" > unit_test_summary.md; then
            echo "### 🧪 Unit Test Results" > unit_test_summary.md
            echo "" >> unit_test_summary.md
            echo "⚠️ Failed to generate unit test summary from logs." >> unit_test_summary.md
          fi
          cat unit_test_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test summary artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-summary
          path: unit_test_summary.md
          retention-days: 30